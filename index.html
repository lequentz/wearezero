  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

box; padding: 16vh 30px 6vh; display: grid; align-content: center; justify-items: center; text-align: center; gap: 4.5vh;\">\n    <div aria-label=\"ZERO\" style=\"font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: clamp(56px, 11vw, 168px); line-height: 1; letter-spacing: 0.02em;\">ZERO<sup style=\"font-size: 0.24em; vertical-align: 2.7em; letter-spacing: 0;\">0<\u002Fsup><\u002Fdiv>\n    <h1 style=\"margin: 0; max-width: 20ch; font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: clamp(30px, 4.4vw, 66px); line-height: 1.08; letter-spacing: -0.02em; text-wrap: balance;\">\n      Zero isn't nothing.\n      <em style=\"display: block; font-style: italic; opacity: 0.55;\">{{ heroTyped }}<span style=\"display: inline-block; width: 0.05em; height: 0.7em; margin-left: 0.06em; background: #E94E1B; animation: zblink 1s steps(1) infinite;\"><\u002Fspan><\u002Fem>\n    <\u002Fh1>\n    <p style=\"margin: 0; max-width: 52ch; font-size: clamp(14px, 1.15vw, 17px); font-weight: 300; line-height: 1.55; opacity: 0.75; text-wrap: pretty;\">We accompany leaders of the hospitality industry to stay bold, creative and refreshingly original.<\u002Fp>\n    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.55; animation: zcue 2.4s ease-in-out infinite;\">Scroll ↓<\u002Fspan>\n  <\u002Fsection>\n\n  <section id=\"gravity\" style=\"position: relative; z-index: 2; padding: 14vh 30px; border-top: 1px solid rgba(233,78,27,0.25);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; display: grid; gap: 8vh;\">\n\n      <div style=\"display: grid; gap: 26px; max-width: 62ch;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; opacity: 0.55;\">01 — Our gravity<\u002Fdiv>\n        <h2 data-reveal=\"\" style=\"transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.16,1,0.3,1); margin: 0; font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: clamp(32px, 4.6vw, 70px); line-height: 1.04; letter-spacing: -0.025em; max-width: 22ch; text-wrap: balance;\">Our gravity, our work<\u002Fh2>\n      <\u002Fdiv>\n\n      <div sc-camel-on-click=\"{{ flipQ }}\" style=\"{{ qWrapStyle }}\">\n        <div style=\"{{ qInnerStyle }}\">\n          <div style=\"{{ qFrontStyle }}\">\n            <p style=\"margin: 0; max-width: 30ch; font-family: 'Bodoni Moda', serif; font-size: clamp(20px, 2.1vw, 32px); line-height: 1.16; text-wrap: pretty;\">Three questions open every conversation.<\u002Fp>\n            <span style=\"margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.6; white-space: nowrap;\">Turn the card →<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"{{ qBackStyle }}\">\n            <sc-for list=\"{{ questions }}\" as=\"q\" hint-placeholder-count=\"3\">\n              <p style=\"margin: 0; flex: 1 1 200px; font-family: 'Bodoni Moda', serif; font-size: clamp(15px, 1.3vw, 19px); line-height: 1.24; text-wrap: pretty;\">{{ q.t }}<\u002Fp>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; gap: 3vh;\">\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 14px 30px;\">\n          <p style=\"margin: 0; font-family: 'Bodoni Moda', serif; font-size: clamp(19px, 1.8vw, 27px); line-height: 1.36; text-wrap: pretty;\">Then we figure out the rest together.<\u002Fp>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.45;\">Open a line ↓<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; border-top: 1px solid rgba(233,78,27,0.25);\">\n          <sc-for list=\"{{ offers }}\" as=\"o\" hint-placeholder-count=\"5\">\n            <div style=\"border-bottom: 1px solid rgba(233,78,27,0.25);\">\n              <button type=\"button\" sc-camel-on-click=\"{{ o.toggle }}\" style=\"{{ o.headStyle }}\">\n                <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em; opacity: 0.5; flex: none;\">{{ o.n }}<\u002Fspan>\n                <span style=\"display: grid; gap: 8px; flex: 1;\">\n                  <span style=\"font-family: 'Bodoni Moda', serif; font-size: clamp(24px, 3.2vw, 46px); line-height: 1.06; text-align: left;\">{{ o.title }}<\u002Fspan>\n                  <span style=\"{{ o.teaserStyle }}\">{{ o.teaser }}<\u002Fspan>\n                <\u002Fspan>\n                <span style=\"{{ o.signStyle }}\">+<\u002Fspan>\n              <\u002Fbutton>\n              <div style=\"{{ o.bodyStyle }}\">\n                <p style=\"margin: 0 0 3.4vh 0; max-width: 64ch; font-size: clamp(15px, 1.25vw, 18px); font-weight: 300; line-height: 1.64; opacity: 0.82; text-wrap: pretty;\">{{ o.body }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"constellation\" style=\"position: relative; z-index: 2; padding: 14vh 30px; border-top: 1px solid rgba(233,78,27,0.25);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; display: grid; gap: 6vh;\">\n      <div style=\"display: grid; gap: 24px; max-width: 60ch;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; opacity: 0.55;\">02 — Constellation<\u002Fdiv>\n        <h2 data-reveal=\"\" style=\"transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.16,1,0.3,1); margin: 0; font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: clamp(32px, 4.6vw, 70px); line-height: 1.04; letter-spacing: -0.025em; max-width: 24ch; text-wrap: balance;\">The people shaping our constellation<\u002Fh2>\n        <p data-reveal=\"\" style=\"transition: opacity 0.9s ease 0.1s, transform 0.9s cubic-bezier(0.16,1,0.3,1) 0.1s; margin: 0; font-size: clamp(15px, 1.25vw, 18px); font-weight: 300; line-height: 1.62; opacity: 0.78; text-wrap: pretty;\">There are a few people orbiting around our planet who make us wonder whether they're actually from Earth. That's probably why we like them. They think differently and constantly give us new reasons to look at the world (and hospitality!) from another angle.<\u002Fp>\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.45;\">Click a card to turn it<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px;\">\n        <sc-for list=\"{{ people }}\" as=\"p\" hint-placeholder-count=\"5\">\n          <div sc-camel-on-click=\"{{ p.flip }}\" style=\"{{ p.wrapStyle }}\">\n            <div style=\"{{ p.innerStyle }}\">\n              <div style=\"{{ p.frontStyle }}\">\n                <sc-if value=\"{{ p.hasPhoto }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"{{ p.photoLayerStyle }}\"><\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ p.hasPhoto }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div aria-hidden=\"true\" style=\"{{ p.scrimStyle }}\"><\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ p.noPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n                  <img src=\"acbc3d53-8fd8-432d-94b8-3ce07a737eaa\" alt=\"\" style=\"position: relative; width: 40px; opacity: 0.65;\">\n                <\u002Fsc-if>\n                <div style=\"position: relative; margin-top: auto; display: grid; gap: 10px;\">\n                  <div style=\"font-family: 'Bodoni Moda', serif; font-size: clamp(20px, 1.9vw, 28px); line-height: 1.08;\">{{ p.name }}<\u002Fdiv>\n                  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.6;\">{{ p.project }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"{{ p.backStyle }}\">\n                <p style=\"margin: 0; font-size: 12.5px; font-weight: 300; line-height: 1.48;\">{{ p.bio }}<\u002Fp>\n                <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.6;\">{{ p.name }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"coordinates\" style=\"position: relative; z-index: 2; padding: 14vh 30px 16vh; border-top: 1px solid rgba(233,78,27,0.25);\">\n    <div style=\"max-width: 980px; margin: 0 auto; display: grid; gap: 44px;\">\n      <div style=\"display: grid; gap: 24px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; opacity: 0.55;\">03 — Our coordinates<\u002Fdiv>\n        <h2 style=\"margin: 0; font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: clamp(32px, 4.6vw, 70px); line-height: 1.04; letter-spacing: -0.025em; max-width: 22ch; text-wrap: balance;\">An old-fashioned code to crack<\u002Fh2>\n        <p style=\"margin: 0; max-width: 54ch; font-size: clamp(16px, 1.4vw, 20px); font-weight: 300; line-height: 1.55; text-wrap: pretty;\">We've chosen the oldest channel there is: word of mouth. Most of the people we work with have found us through someone, somewhere, who thought we should meet. We quite like it that way. But if you really want to reach us — decode it yourself, one letter per signal.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; gap: 26px;\">\n        <div data-cipher=\"\" style=\"display: grid; gap: 24px; padding: 26px 24px; background: #CFDDE2; border: 1px solid rgba(233,78,27,0.25);\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 16px 18px;\">\n            <sc-for list=\"{{ cipherA }}\" as=\"tok\" hint-placeholder-count=\"11\">\n              <div style=\"display: grid; gap: 9px; justify-items: center;\">\n                <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.12em; line-height: 1; opacity: 0.6;\">{{ tok.morse }}<\u002Fspan>\n                <input type=\"text\" sc-camel-max-length=\"1\" aria-label=\"{{ tok.aria }}\" data-slot=\"{{ tok.i }}\" style=\"{{ tok.inputStyle }}\">\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 16px 18px;\">\n            <sc-for list=\"{{ cipherB }}\" as=\"tok\" hint-placeholder-count=\"13\">\n              <div style=\"display: grid; gap: 9px; justify-items: center;\">\n                <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.12em; line-height: 1; opacity: 0.6;\">{{ tok.morse }}<\u002Fspan>\n                <input type=\"text\" sc-camel-max-length=\"1\" aria-label=\"{{ tok.aria }}\" data-slot=\"{{ tok.i }}\" style=\"{{ tok.inputStyle }}\">\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px;\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55;\">{{ progressLabel }}<\u002Fspan>\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleKey }}\" style=\"border: 1px solid rgba(233,78,27,0.35); background: transparent; border-radius: 999px; padding: 10px 18px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #E94E1B; cursor: pointer;\" style-hover=\"background: #E94E1B; color: #F9F7EF;\">{{ keyLabel }}<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ revealAll }}\" style=\"{{ giveUpStyle }}\">{{ giveUpLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"{{ keyPanelStyle }}\">\n          <sc-for list=\"{{ morseKey }}\" as=\"k\" hint-placeholder-count=\"28\">\n            <div style=\"display: flex; gap: 10px; align-items: baseline; font-family: 'JetBrains Mono', monospace; font-size: 11px;\">\n              <span style=\"width: 1.4em; opacity: 0.55;\">{{ k.ch }}<\u002Fspan>\n              <span style=\"letter-spacing: 0.1em;\">{{ k.code }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div id=\"revealed-email\" style=\"min-height: 66px; display: flex; align-items: center;\">\n          <sc-if value=\"{{ solved }}\" hint-placeholder-val=\"{{ false }}\">\n            <a href=\"mailto:callmemaybe@wearezero.fr\" style=\"font-family: 'Bodoni Moda', serif; font-size: clamp(22px, 3vw, 46px); border-bottom: 1px solid rgba(233,78,27,0.4);\">callmemaybe@wearezero.fr<\u002Fa>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ unsolved }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"font-family: 'Bodoni Moda', serif; font-style: italic; font-size: clamp(19px, 2.3vw, 34px); opacity: 0.42;\">{{ teaseLabel }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"{{ pushWrapStyle }}\">\n    <div style=\"{{ pushCardStyle }}\">\n      <p style=\"margin: 0; font-family: 'Bodoni Moda', serif; font-size: clamp(22px, 2.8vw, 38px); line-height: 1.14; text-wrap: pretty;\">Still cracking ?<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ giveUpPush }}\" style=\"border: 1px solid #FFED00; background: #FFED00; border-radius: 999px; padding: 9px 16px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #E94E1B; cursor: pointer;\" style-hover=\"border-color: #E94E1B; background: #E94E1B; color: #F9F7EF;\">Just give me the address<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ dismissPush }}\" style=\"border: 1px solid rgba(233,78,27,0.35); background: transparent; border-radius: 999px; padding: 9px 16px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #E94E1B; cursor: pointer;\" style-hover=\"background: #E94E1B; color: #F9F7EF;\">Let me keep cracking<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <footer style=\"position: relative; z-index: 2; padding: 26px 30px; background: #E94E1B; color: #F9F7EF;\">\n    <div style=\"max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; justify-content: space-between;\">\n      <img data-footer-mark=\"\" src=\"b291695a-72c1-43da-bdab-60fafce817b8\" alt=\"\" style=\"width: 44px; margin-left: min(120px, 8vw); flex: none; transition: opacity .5s ease;\">\n      <a href=\"https://wearezero.substack.com/\" target=\"_blank\" rel=\"noopener\" style=\"font-family: 'Bodoni Moda', serif; font-size: clamp(15px, 1.5vw, 22px); line-height: 1.1; white-space: nowrap; color: #F9F7EF; border-bottom: 1px solid rgba(249,247,239,0.4);\" style-hover=\"opacity: 0.75; color: #F9F7EF;\">Steal our Tips for Zero &gt;<\u002Fa>\n      <a href=\"mailto:callmemaybe@wearezero.fr\" style=\"min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: #F9F7EF; border-bottom: 1px solid rgba(249,247,239,0.45);\" style-hover=\"opacity: 0.75; color: #F9F7EF;\">callmemaybe@wearezero.fr<\u002Fa>\n      <div style=\"display: flex; gap: 14px; min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;\">\n        <a href=\"https://www.instagram.com/wearezerogroup/\" target=\"_blank\" rel=\"noopener\" style=\"color: #F9F7EF; opacity: 0.8;\" style-hover=\"opacity: 1; color: #F9F7EF;\">Instagram<\u002Fa>\n        <a href=\"https://www.linkedin.com/company/wearezerofr/\" target=\"_blank\" rel=\"noopener\" style=\"color: #F9F7EF; opacity: 0.8;\" style-hover=\"opacity: 1; color: #F9F7EF;\">LinkedIn<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.7;\">Zero — Paris © 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst HERO2 = \"It's everything yet to come.\";\nconst RED = '#E94E1B', ECRU = '#F9F7EF', PEARL = '#CFDDE2', YELLOW = '#FFED00';\n\nconst MORSE = { a:'.-', b:'-...', c:'-.-.', d:'-..', e:'.', f:'..-.', g:'--.', h:'....', i:'..', j:'.---',\n  k:'-.-', l:'.-..', m:'--', n:'-.', o:'---', p:'.--.', q:'--.-', r:'.-.', s:'...', t:'-',\n  u:'..-', v:'...-', w:'.--', x:'-..-', y:'-.--', z:'--..', '@':'.--.-.', '.':'.-.-.-' };\n\nconst TARGET = \"callmemaybe@wearezero.fr\".split('');\n\nconst QUESTIONS = [\n  ['Q1', 'Why does this project really need to exist?'],\n  ['Q2', 'What are you willing to risk?'],\n  ['Q3', 'If you knew some people would hate it, what would you do?']\n];\n\nconst OFFERS = [\n  ['01', 'Get Unstuck', 'A decision going nowhere.', \"Call us. We like problems — they usually hide the best opportunities.\"],\n  ['02', 'Put Your Vision to the Test', 'Coherent, or not.', \"Sometimes you need someone to tell you it holds. Sometimes that it doesn't. We put the original vision up against the reality of running the place.\"],\n  ['03', 'Question the Obvious', 'Never a box to tick.', \"Social, influence, press, partnerships: we look for what can be challenged, discarded or reinvented — then find the most honest way to tell your story.\"],\n  ['04', 'Take a Step Back', 'Distance, on purpose.', \"We read your successes as closely as your failures. Often you don't need another idea — you need another point of view.\"],\n  ['05', 'See Beyond Hospitality', 'We travel, observe, collect.', \"Places, people, cultural movements, new ways of hosting and living. Then we look at what all of it could unlock for you.\"]\n];\n\nconst PEOPLE = [\n  ['Thierry Teyssier', '700 000 Heures Impact', 'assets/p-thierry.jpg', \"An activist of beauty and poetry, he tests without limits and has little interest in pleasing everyone. If you don't like what he creates, you're probably not the right traveller. Radical in his approach to hospitality, he was also the first person to believe in Zero — and continues to challenge us, relentlessly.\"],\n  ['Sophie Galvagnon', 'Selar', 'assets/p-sophie.jpg', \"The Franco-Swedish explorer and the youngest woman decorated with France's Order of Maritime Merit is rewriting polar expedition cruising along with Julia Bijaoui and Quentin Vacher. Aboard Selar's Captain Arctic, she will be the captain of the first solar sailing ship built to run zero-emission 90% of the time.\"],\n  ['David Tuchbant', 'Fawn Bluff', 'assets/p-david.jpg', \"A French entrepreneur who reimagined a former Hollywood retreat lost deep in Canada's Great Bear Rainforest as Fawn Bluff — a private lodge reachable only by seaplane or boat, where sheer remoteness is the rarest luxury. Built hand-in-hand with the Homalco First Nation, on whose land it stands, it's a place where human connection replaces white-glove polish.\"],\n  ['Sandrine Henry', 'Riad Berbère', 'assets/p-sandrine.jpg', \"The French interior architect and art collector restored, along with her family, a Marrakech riad into a guesthouse and artist residency — a silent sanctuary where art and bon goût meet. Understated luxury in a pared-back palette of white, ochre and earth: the poetry of slow living in the medina.\"],\n  ['Frederik Kubierschky & Catharina Lütjens', 'Vocabolo Moscatelli', 'assets/p-frederik.jpg', \"Two former conventional hoteliers who became the wild children of Umbria after turning a 12th-century monastery into a boutique hotel. Design-led hospitality with soul — rooted in local craft, community, and the art of the generous host.\"]\n];\n\nclass Component extends DCLogic {\n  state = { typed: HERO2, open: -1, flipped: [], entries: TARGET.map(() => ''), showKey: false, qFlipped: false, nudge: false, pushDone: false };\n\n  componentDidMount() {\n    this.orbitEl = document.querySelector('[data-orbit]');\n    this.counterEl = document.querySelector('[data-counter]');\n\n    this.footerEl = document.querySelector('footer');\n\n    this.scrollProgress = () => {\n      // the page may live in a scrolling wrapper (preview host) rather than the window\n      const cands = [document.scrollingElement, document.body];\n      let el = this.counterEl && this.counterEl.parentElement;\n      while (el) { cands.push(el); el = el.parentElement; }\n      let best = 0;\n      cands.forEach((n) => {\n        if (!n) return;\n        const max = n.scrollHeight - n.clientHeight;\n        if (max > 40 && n.scrollTop > 0) best = Math.max(best, n.scrollTop / max);\n      });\n      const wmax = document.documentElement.scrollHeight - window.innerHeight;\n      if (wmax > 40) best = Math.max(best, window.scrollY / wmax);\n      // the orange band is the finish line: 000 lands when it is fully in view\n      if (!this.footerEl) this.footerEl = document.querySelector('footer');\n      if (this.footerEl) {\n        const fr = this.footerEl.getBoundingClientRect();\n        // 000 the moment the orange band's top edge reaches the viewport bottom\n        const span = window.innerHeight * 0.5;\n        const reach = (window.innerHeight - fr.top + span) / span;\n        best = Math.max(best, Math.min(1, Math.max(0, reach)));\n      }\n      return Math.min(1, Math.max(0, best));\n    };\n\n    this.onScroll = () => {\n      // synchronous: never depends on rAF being scheduled\n      {\n        const p = this.scrollProgress();\n        if (!this.counterEl) this.counterEl = document.querySelector('[data-counter]');\n        if (!this.orbitEl) this.orbitEl = document.querySelector('[data-orbit]');\n        if (this.counterEl) this.counterEl.textContent = String(Math.round((1 - p) * 100)).padStart(3, '0');\n        // flip the counter to ecru once it sits over the orange band\n        if (!this.counterBlock) this.counterBlock = document.querySelector('[data-counter-block]');\n        if (!this.footerEl) this.footerEl = document.querySelector('footer');\n        if (this.counterBlock && this.footerEl) {\n          const cb = this.counterBlock.getBoundingClientRect();\n          const fb = this.footerEl.getBoundingClientRect();\n          const over = Math.min(cb.bottom, fb.bottom) - Math.max(cb.top, fb.top) > cb.height * 0.4;\n          this.counterBlock.style.color = over ? ECRU : RED;\n        }\n        if (this.orbitEl) {\n          const s = 0.9 + p * 0.45;\n          const x = -84 * Math.pow(p, 2.2);   // hugs the right edge, swings down-left at the very end\n          const y = -46 * Math.pow(p, 1.4) + 44 * Math.pow(p, 6);\n          this.orbitEl.style.transform = 'translate3d(-50%,-50%,0) translate3d(' + x + 'vw,' + y + 'vh,0) rotate(' + (p * 400) + 'deg) scale(' + s + ')';\n          const mark = document.querySelector('[data-footer-mark]');\n          const mr = mark && mark.getBoundingClientRect();\n          const docking = mr && mr.top < window.innerHeight - 30 && mr.bottom > 0;\n          if (mark) {\n            // hand off to the static footer mark as the orange band comes in\n            const enter = Math.min(1, Math.max(0, (window.innerHeight - mr.top) / (mr.height * 1.5)));\n            mark.style.opacity = String(enter);\n            this._handoff = enter;\n          }\n          this.orbitEl.style.zIndex = '0';\n          this.orbitEl.style.transition = 'none';\n          const coords = document.getElementById('coordinates');\n          let dip = 1;\n          if (coords) {\n            const r = coords.getBoundingClientRect();\n            const overlap = Math.min(r.bottom, window.innerHeight) - Math.max(r.top, 0);\n            if (overlap > 0) dip = Math.max(0, 1 - (overlap / window.innerHeight) * 2.2); // clears out over the code game\n            // then slides back in as the end of Coordinates approaches the band\n            const tail = Math.min(1, Math.max(0, (window.innerHeight - r.bottom + 260) / 320));\n            dip = Math.max(dip, tail);\n          }\n          const fade = dip * (1 - (this._handoff || 0));\n          this.orbitEl.style.opacity = String((0.5 + p * 0.4) * fade);\n          this.orbitEl.style.visibility = fade < 0.04 ? 'hidden' : 'visible';\n        }\n      }\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    document.addEventListener('scroll', this.onScroll, true);\n    window.addEventListener('resize', this.onScroll);\n    this._tick = setInterval(this.onScroll, 400);\n    this.onScroll();\n    this.startTyping();\n\n    // after 4s on the code game, offer the way out\n    this.nudgeIo = new IntersectionObserver((es) => {\n      es.forEach((e) => {\n        if (e.isIntersecting && !this._nudgeTimer && !this.state.nudge) {\n          this._nudgeTimer = setTimeout(() => this.setState({ nudge: true }), 5000);\n        }\n      });\n    }, { threshold: 0.25 });\n    const coordsEl = document.getElementById('coordinates');\n    if (coordsEl) this.nudgeIo.observe(coordsEl);\n\n    this.io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (e.isIntersecting) {\n          const base = parseFloat(e.target.dataset.baseOpacity);\n          e.target.style.opacity = base > 0.02 ? String(base) : '1';\n          e.target.style.transform = 'translate3d(0,0,0)';\n          this.io.unobserve(e.target);\n        }\n      });\n    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\n    document.querySelectorAll('[data-reveal]').forEach((el) => {\n      const cur = parseFloat(getComputedStyle(el).opacity);\n      el.dataset.baseOpacity = cur > 0.02 ? String(cur) : '1';\n      el.style.opacity = '0';\n      el.style.transform = 'translate3d(0,26px,0)';\n      this.io.observe(el);\n    });\n    this.onCipher = (e) => {\n      const el = e.target;\n      if (!el || !el.dataset || el.dataset.slot === undefined) return;\n      const i = parseInt(el.dataset.slot, 10);\n      if (e.type === 'input') {\n        const raw = (el.value || '').trim().slice(-1);\n        el.value = raw;\n        this.setEntry(i, raw);\n        if (raw) this.focusSlot(i + 1);\n      } else if (e.type === 'keydown') {\n        if (e.key === 'Backspace' && !el.value) this.focusSlot(i - 1);\n        if (e.key === 'ArrowLeft') this.focusSlot(i - 1);\n        if (e.key === 'ArrowRight') this.focusSlot(i + 1);\n      }\n    };\n    document.addEventListener('input', this.onCipher, true);\n    document.addEventListener('keydown', this.onCipher, true);\n\n    this._safety = setTimeout(() => {\n      document.querySelectorAll('[data-reveal]').forEach((el) => {\n        if (el.style.opacity === '0') {\n          const base = parseFloat(el.dataset.baseOpacity);\n          el.style.opacity = base > 0.02 ? String(base) : '1';\n          el.style.transform = 'translate3d(0,0,0)';\n        }\n      });\n    }, 6000);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.onScroll);\n    document.removeEventListener('scroll', this.onScroll, true);\n    window.removeEventListener('resize', this.onScroll);\n    clearInterval(this._tick);\n    this._typing = false;\n    document.removeEventListener('input', this.onCipher, true);\n    document.removeEventListener('keydown', this.onCipher, true);\n    clearTimeout(this._safety);\n    if (this._typeRaf) cancelAnimationFrame(this._typeRaf);\n    clearTimeout(this._nudgeTimer);\n    if (this.nudgeIo) this.nudgeIo.disconnect();\n    if (this.io) this.io.disconnect();\n  }\n\n  startTyping() {\n    if (this._typeRaf) cancelAnimationFrame(this._typeRaf);\n    const t0 = performance.now();\n    this._typing = true;\n    this.setState({ typed: '' });\n    const step = (now) => {\n      if (!this._typing) return;\n      const i = Math.min(HERO2.length, Math.floor((now - t0 - 1600) / 48));\n      const next = HERO2.slice(0, Math.max(0, i));\n      if (this.state.typed !== next) this.setState({ typed: next });\n      if (i < HERO2.length) this._typeRaf = requestAnimationFrame(step);\n      else this._typeRaf = null;\n    };\n    this._typeRaf = requestAnimationFrame(step);\n  }\n\n  setEntry(i, ch) {\n    const entries = this.state.entries.slice();\n    entries[i] = ch;\n    this.setState({ entries });\n  }\n\n  focusSlot(i) {\n    const el = document.querySelector('[data-slot=\"' + i + '\"]');\n    if (el) el.focus();\n  }\n\n  revealAll = () => {\n    document.querySelectorAll('[data-slot]').forEach((el) => {\n      const i = parseInt(el.dataset.slot, 10);\n      if (!isNaN(i) && TARGET[i]) el.value = TARGET[i];\n    });\n    this.setState({ entries: TARGET.slice() });\n    clearTimeout(this._scrollEmailTimer);\n    this._scrollEmailTimer = setTimeout(() => {\n      const el = document.getElementById('revealed-email');\n      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });\n    }, 650);\n  };\n  toggleKey = () => this.setState({ showKey: !this.state.showKey });\n\n  renderVals() {\n    const st = this.state;\n    const correct = st.entries.filter((c, i) => c && c.toLowerCase() === TARGET[i]).length;\n    const solved = correct === TARGET.length;\n\n    const cipher = TARGET.map((ch, i) => {\n      const v = st.entries[i] || '';\n      const ok = v && v.toLowerCase() === ch;\n      const wrong = v && !ok;\n      return {\n        i: String(i),\n        morse: MORSE[ch] || ch,\n        aria: 'Signal ' + (i + 1),\n        inputStyle: {\n          width: '30px', height: '38px', textAlign: 'center', textTransform: 'lowercase',\n          fontFamily: \"'Bodoni Moda', serif\", fontSize: '22px', lineHeight: 1,\n          color: wrong ? 'rgba(233,78,27,0.45)' : RED,\n          background: ok ? YELLOW : 'rgba(249,247,239,0.5)',\n          border: 'none', borderBottom: '1px solid ' + (wrong ? 'rgba(233,78,27,0.3)' : 'rgba(233,78,27,0.55)'),\n          borderRadius: ok ? '3px' : '0', outline: 'none',\n          transition: 'background .3s ease, color .3s ease'\n        }\n      };\n    });\n\n    const offers = OFFERS.map(([n, title, teaser, body], i) => {\n      const open = st.open === i;\n      return {\n        n, title, body, teaser,\n        teaserStyle: {\n          fontFamily: 'Archivo, sans-serif', fontSize: '14px', fontWeight: 300,\n          opacity: open ? 0 : 0.6, maxWidth: '26ch', textAlign: 'left',\n          transition: 'opacity .3s ease'\n        },\n        toggle: () => this.setState({ open: open ? -1 : i }),\n        headStyle: {\n          display: 'flex', gap: '22px', alignItems: 'baseline', width: '100%',\n          background: 'transparent', border: 'none', padding: '3vh 0', cursor: 'pointer', color: RED,\n          opacity: open ? 1 : 0.72, transition: 'opacity .3s ease'\n        },\n        signStyle: {\n          fontFamily: \"'JetBrains Mono', monospace\", fontSize: '16px', lineHeight: '30px',\n          width: '30px', height: '30px', textAlign: 'center', borderRadius: '999px', flex: 'none',\n          background: open ? YELLOW : 'transparent',\n          border: '1px solid ' + (open ? YELLOW : 'rgba(233,78,27,0.35)'),\n          transform: open ? 'rotate(45deg)' : 'none',\n          transition: 'transform .35s cubic-bezier(0.16,1,0.3,1), background .3s ease, border-color .3s ease'\n        },\n        bodyStyle: {\n          maxHeight: open ? '460px' : '0', overflow: 'hidden',\n          opacity: open ? 1 : 0,\n          transition: 'max-height .55s cubic-bezier(0.16,1,0.3,1), opacity .4s ease'\n        }\n      };\n    });\n\n    const people = PEOPLE.map(([name, project, photo, bio], i) => {\n      const on = st.flipped.indexOf(i) !== -1;\n      const face = {\n        position: 'absolute', inset: 0, boxSizing: 'border-box', padding: '22px',\n        display: 'flex', flexDirection: 'column', justifyContent: 'space-between',\n        backfaceVisibility: 'hidden', WebkitBackfaceVisibility: 'hidden', borderRadius: '2px'\n      };\n      return {\n        name, project, bio, photo,\n        hasPhoto: !!photo,\n        noPhoto: !photo,\n        photoLayerStyle: photo ? {\n          position: 'absolute', inset: 0,\n          backgroundImage: 'url(\"' + photo + '\")',\n          backgroundSize: 'cover', backgroundPosition: 'center',\n          filter: 'grayscale(1)'\n        } : { display: 'none' },\n        scrimStyle: {\n          position: 'absolute', inset: 0,\n          background: 'linear-gradient(to top, rgba(23,20,15,0.72) 0%, rgba(23,20,15,0.15) 52%, rgba(23,20,15,0) 100%)'\n        },\n        flip: () => this.setState({\n          flipped: on ? st.flipped.filter((x) => x !== i) : st.flipped.concat([i])\n        }),\n        wrapStyle: { perspective: '1200px', aspectRatio: '3 / 4', cursor: 'pointer' },\n        innerStyle: {\n          position: 'relative', width: '100%', height: '100%',\n          transformStyle: 'preserve-3d',\n          transform: on ? 'rotateY(180deg)' : 'none',\n          transition: 'transform .8s cubic-bezier(0.16,1,0.3,1)'\n        },\n        frontStyle: Object.assign({}, face, {\n          border: '1px solid rgba(233,78,27,0.35)',\n          background: i % 2 ? PEARL : ECRU,\n          color: photo ? ECRU : RED,\n          overflow: 'hidden'\n        }),\n        backStyle: Object.assign({}, face, {\n          transform: 'rotateY(180deg)',\n          background: i % 2 ? RED : PEARL, color: i % 2 ? ECRU : RED,\n          justifyContent: 'center', alignItems: 'center', textAlign: 'center', gap: '16px', overflow: 'hidden'\n        })\n      };\n    });\n\n    const qFace = {\n      position: 'absolute', inset: 0, boxSizing: 'border-box', padding: 'clamp(20px, 2.2vw, 30px)',\n      backfaceVisibility: 'hidden', WebkitBackfaceVisibility: 'hidden',\n      border: '1px solid rgba(233,78,27,0.3)', background: PEARL, borderRadius: '2px'\n    };\n\n    return {\n      heroTyped: st.typed,\n      questions: QUESTIONS.map(([n, t]) => ({ n, t })),\n      flipQ: () => this.setState({ qFlipped: !st.qFlipped }),\n      qWrapStyle: { perspective: '1600px', minHeight: 'clamp(130px, 13vw, 172px)', cursor: 'pointer' },\n      qInnerStyle: {\n        position: 'relative', width: '100%', height: 'clamp(130px, 13vw, 172px)',\n        transformStyle: 'preserve-3d',\n        transform: st.qFlipped ? 'rotateX(180deg)' : 'none',\n        transition: 'transform .9s cubic-bezier(0.16,1,0.3,1)'\n      },\n      qFrontStyle: Object.assign({}, qFace, {\n        display: 'flex', flexWrap: 'wrap', gap: '16px 30px',\n        alignItems: 'center', justifyContent: 'space-between', color: RED\n      }),\n      qBackStyle: Object.assign({}, qFace, {\n        transform: 'rotateX(180deg)', background: RED, color: ECRU,\n        display: 'flex', flexWrap: 'wrap', gap: '12px 26px', alignItems: 'center'\n      }),\n      offers, people, cipher, solved,\n      unsolved: !solved,\n      progressLabel: solved ? 'Signal decoded' : correct + ' / ' + TARGET.length + ' letters right',\n      teaseLabel: correct === 0 ? 'One letter per signal. Take your time.' : 'Keep going.',\n      keyLabel: st.showKey ? 'Hide the morse key' : 'Show the morse key',\n      keyPanelStyle: {\n        maxHeight: st.showKey ? '340px' : '0', overflow: 'hidden',\n        opacity: st.showKey ? 1 : 0,\n        display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(96px, 1fr))', gap: '10px 16px',\n        transition: 'max-height .5s cubic-bezier(0.16,1,0.3,1), opacity .4s ease'\n      },\n      morseKey: Object.keys(MORSE).map((ch) => ({ ch: ch.toUpperCase(), code: MORSE[ch] })),\n      cipherA: cipher.slice(0, 11),\n      cipherB: cipher.slice(11),\n      dismissPush: () => this.setState({ pushDone: true }),\n      giveUpPush: () => { this.setState({ pushDone: true }); this.revealAll(); },\n      pushWrapStyle: {\n        position: 'fixed', inset: 0, zIndex: 40,\n        display: 'grid', placeItems: 'center', padding: '30px',\n        background: 'rgba(207,221,226,0.55)',\n        backdropFilter: 'blur(3px)', WebkitBackdropFilter: 'blur(3px)',\n        opacity: st.nudge && !st.pushDone && !solved ? 1 : 0,\n        pointerEvents: st.nudge && !st.pushDone && !solved ? 'auto' : 'none',\n        transition: 'opacity .6s ease'\n      },\n      pushCardStyle: {\n        display: 'grid', gap: '18px', justifyItems: 'start', maxWidth: '30ch',\n        padding: 'clamp(26px, 3vw, 40px)', background: ECRU, color: RED,\n        border: '1px solid rgba(233,78,27,0.35)', borderRadius: '2px',\n        transform: st.nudge && !st.pushDone && !solved ? 'translateY(0)' : 'translateY(12px)',\n        transition: 'transform .6s cubic-bezier(0.16,1,0.3,1)'\n      },\n      giveUpLabel: 'Reveal it all',\n      giveUpStyle: {\n        border: '1px solid rgba(233,78,27,0.35)', background: 'transparent',\n        borderRadius: '999px', padding: '10px 18px',\n        fontFamily: \"'JetBrains Mono', monospace\", fontSize: '10px',\n        letterSpacing: '0.18em', textTransform: 'uppercase', color: RED, cursor: 'pointer',\n        transition: 'background .4s ease, border-color .4s ease'\n      },\n      revealAll: this.revealAll,\n      toggleKey: this.toggleKey\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
